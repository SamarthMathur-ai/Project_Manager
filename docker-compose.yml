services:
  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile

    container_name: project_manager_backend

    ports:
      - "3000:3000"

    env_file:
      - ./server/.env

    depends_on:
      - mysql

    volumes:
      - ./server:/app/server
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: project_manager_frontend

    ports:
      - "5173:5173"

    depends_on:
      - server

    volumes:
      - ./client:/app
      - /app/node_modules

  mysql:
    image: mysql:8.0

    container_name: project_manager_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: project_manage

    

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/database_project_manager.sql:/docker-entrypoint-initdb.d/database_project_manager.sql

volumes:
  mysql_data: